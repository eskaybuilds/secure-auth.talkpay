name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The SDK 58 template has no `expo-module build`; `npm run build` is its replacement (tsc → build/).
      - run: npm run build

      - name: Example app typecheck
        working-directory: example
        run: npm ci
      - run: npm run typecheck:example
